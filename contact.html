<!doctype html>
<html lang="ka">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      if (localStorage.getItem("portfolio-theme") === "light") {
        document.documentElement.classList.add("light-mode");
      }
    </script>
    <style>
      html.light-mode body { background-color: #f8fafc; color: #0f172a; }
      html.light-mode header.bg-slate-950\/80 { background-color: rgb(255 255 255 / 90%); border-color: #e2e8f0; }
      html.light-mode footer,
      html.light-mode [class~="border-white/10"] { border-color: #e2e8f0; }
      html.light-mode [class~="bg-slate-900"] { background-color: #fff; }
      html.light-mode [class~="bg-slate-950"] { background-color: #f8fafc; }
      html.light-mode [class~="bg-gradient-to-br"] { background-image: linear-gradient(135deg, #f3e8ff, #fff 60%, #f8fafc); }
      html.light-mode [class~="text-white"] { color: #0f172a; }
      html.light-mode [class~="text-slate-100"],
      html.light-mode [class~="text-slate-300"] { color: #334155; }
      html.light-mode [class~="text-slate-400"],
      html.light-mode [class~="text-slate-500"] { color: #64748b; }
      html.light-mode [class~="text-violet-300"],
      html.light-mode [class~="text-violet-400"] { color: #7c3aed; }
      html.light-mode [class~="bg-violet-500"][class~="text-white"] { color: #fff; }
      html.light-mode [class~="bg-violet-500/15"] { background-color: #f3e8ff; }
      html.light-mode [class~="hover:bg-white/10"]:hover { background-color: #f1f5f9; }
      html.light-mode input,
      html.light-mode textarea { background-color: #fff; color: #0f172a; }
      html.light-mode input::placeholder,
      html.light-mode textarea::placeholder { color: #94a3b8; }
      body, header, footer, main section, main article, main li, input, textarea, button, a {
        transition: background-color 300ms ease, color 300ms ease, border-color 300ms ease, box-shadow 300ms ease, transform 300ms ease;
      }
      body::before {
        position: fixed; z-index: -1; top: -10rem; right: -8rem; width: 28rem; height: 28rem;
        border-radius: 9999px; background: radial-gradient(circle, rgb(139 92 246 / 14%), transparent 70%);
        content: ""; pointer-events: none; animation: ambient-drift 12s ease-in-out infinite alternate;
      }
      main > section, main article, main li { animation: rise-in 700ms ease-out backwards; }
      main article:nth-child(2), main li:nth-child(2) { animation-delay: 100ms; }
      main article:nth-child(3), main li:nth-child(3) { animation-delay: 200ms; }
      @keyframes rise-in {
        from { opacity: 0; transform: translateY(14px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes ambient-drift {
        from { transform: translate3d(0, 0, 0); }
        to { transform: translate3d(-2rem, 2rem, 0); }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
      }
    </style>
    <title>კონტაქტი | ნიკოლოზის პორტფოლიო</title>
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100 antialiased">
    <div class="flex min-h-screen flex-col">
      <header class="border-b border-white/10 bg-slate-950/80">
        <div class="mx-auto flex max-w-5xl flex-wrap items-center justify-between gap-4 px-4 py-4 sm:px-6 sm:py-6">
          <a href="index.html" class="text-lg font-bold tracking-tight text-white sm:text-xl">ნიკოლოზის <span class="text-violet-400">პორტფოლიო</span></a>
          <div class="flex items-center gap-2 sm:gap-3">
            <button type="button" data-menu-toggle aria-expanded="false" aria-controls="main-navigation" aria-label="მენიუს გახსნა" class="inline-flex h-10 w-10 items-center justify-center rounded-full border border-white/10 bg-white/5 text-slate-300 hover:bg-white/10 focus:outline-none focus:ring-2 focus:ring-violet-400 sm:hidden">
              <svg data-menu-open-icon aria-hidden="true" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16" />
              </svg>
              <svg data-menu-close-icon aria-hidden="true" class="hidden h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" d="m6 6 12 12M18 6 6 18" />
              </svg>
            </button>
            <button type="button" data-theme-toggle aria-label="ღია რეჟიმზე გადართვა" class="rounded-full border border-white/10 bg-white/5 px-3 py-2 text-sm font-medium text-slate-300 hover:bg-white/10 focus:outline-none focus:ring-2 focus:ring-violet-400 sm:px-4">
              <span data-theme-icon aria-hidden="true">☀</span>
              <span data-theme-label class="hidden sm:inline">ღია რეჟიმი</span>
            </button>
          </div>
          <nav id="main-navigation" aria-label="მთავარი ნავიგაცია" class="hidden w-full rounded-2xl border border-white/10 bg-white/5 p-2 sm:block sm:w-auto sm:border-0 sm:bg-transparent sm:p-0">
              <ul class="flex flex-col gap-1 text-sm font-medium sm:flex-row sm:gap-2">
                <li><a href="index.html" class="block rounded-xl px-4 py-3 text-slate-300 transition hover:bg-white/10 hover:text-white sm:rounded-full sm:py-2">მთავარი</a></li>
                <li><a href="project.html" class="block rounded-xl px-4 py-3 text-slate-300 transition hover:bg-white/10 hover:text-white sm:rounded-full sm:py-2">პროექტები</a></li>
                <li><a href="contact.html" aria-current="page" class="block rounded-xl bg-violet-500/15 px-4 py-3 text-violet-300 transition hover:bg-violet-500/25 sm:rounded-full sm:py-2">კონტაქტი</a></li>
              </ul>
          </nav>
        </div>
      </header>
      <main class="mx-auto w-full max-w-5xl flex-1 px-4 py-12 sm:px-6 sm:py-20">
        <section class="mx-auto max-w-2xl">
          <p class="text-sm font-semibold uppercase tracking-[0.2em] text-violet-300">მზად ვარ სასაუბროდ</p>
          <h1 class="mt-2 text-3xl font-bold tracking-tight text-white sm:text-5xl">დამიკავშირდით</h1>
          <p class="mt-4 leading-7 text-slate-400">შეავსეთ ფორმა და გამომიგზავნეთ შეტყობინება.</p>
          <div class="mt-8 rounded-2xl border border-white/10 bg-slate-900 p-4 sm:p-8">
            <h2 class="text-xl font-bold text-white">საკონტაქტო ფორმა</h2>
            <form action="#" method="get" class="mt-6 space-y-5">
              <div>
                <label for="name" class="mb-2 block text-sm font-medium text-slate-300">სახელი</label>
                <input type="text" id="name" name="name" autocomplete="name" required class="w-full rounded-xl border border-white/10 bg-slate-950 px-4 py-3 text-white outline-none transition placeholder:text-slate-600 focus:border-violet-400 focus:ring-2 focus:ring-violet-400/20" />
              </div>
              <div>
                <label for="email" class="mb-2 block text-sm font-medium text-slate-300">ელ-ფოსტა</label>
                <input type="email" id="email" name="email" autocomplete="email" required class="w-full rounded-xl border border-white/10 bg-slate-950 px-4 py-3 text-white outline-none transition placeholder:text-slate-600 focus:border-violet-400 focus:ring-2 focus:ring-violet-400/20" />
              </div>
              <div>
                <label for="message" class="mb-2 block text-sm font-medium text-slate-300">შეტყობინება</label>
                <textarea id="message" name="message" rows="5" required class="w-full resize-y rounded-xl border border-white/10 bg-slate-950 px-4 py-3 text-white outline-none transition placeholder:text-slate-600 focus:border-violet-400 focus:ring-2 focus:ring-violet-400/20"></textarea>
              </div>
              <button type="submit" class="rounded-full bg-violet-500 px-6 py-3 font-semibold text-white transition hover:bg-violet-400 focus:outline-none focus:ring-2 focus:ring-violet-300 focus:ring-offset-2 focus:ring-offset-slate-900">გაგზავნა <span aria-hidden="true" class="ml-1">→</span></button>
            </form>
          </div>
        </section>
      </main>
      <footer class="border-t border-white/10 px-6 py-6 text-center text-sm text-slate-500">
        <p>&copy; 2026 ნიკოლოზი. ყველა უფლება დაცულია.</p>
      </footer>
    </div>
    <script>
      const menuToggle = document.querySelector("[data-menu-toggle]");
      const navigation = document.querySelector("#main-navigation");
      const menuOpenIcon = document.querySelector("[data-menu-open-icon]");
      const menuCloseIcon = document.querySelector("[data-menu-close-icon]");
      const themeToggle = document.querySelector("[data-theme-toggle]");
      const themeIcon = document.querySelector("[data-theme-icon]");
      const themeLabel = document.querySelector("[data-theme-label]");

      function updateThemeButton() {
        const isLight = document.documentElement.classList.contains("light-mode");
        themeToggle.setAttribute("aria-label", isLight ? "მუქ რეჟიმზე გადართვა" : "ღია რეჟიმზე გადართვა");
        themeToggle.setAttribute("aria-pressed", String(isLight));
        themeIcon.textContent = isLight ? "☾" : "☀";
        themeLabel.textContent = isLight ? "მუქი რეჟიმი" : "ღია რეჟიმი";
      }

      function setMenuOpen(isOpen) {
        menuToggle.setAttribute("aria-expanded", String(isOpen));
        menuToggle.setAttribute("aria-label", isOpen ? "მენიუს დახურვა" : "მენიუს გახსნა");
        navigation.classList.toggle("hidden", !isOpen);
        menuOpenIcon.classList.toggle("hidden", isOpen);
        menuCloseIcon.classList.toggle("hidden", !isOpen);
      }

      menuToggle.addEventListener("click", () => {
        setMenuOpen(menuToggle.getAttribute("aria-expanded") !== "true");
      });
      navigation.querySelectorAll("a").forEach((link) => {
        link.addEventListener("click", () => setMenuOpen(false));
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") setMenuOpen(false);
      });
      window.matchMedia("(min-width: 640px)").addEventListener("change", () => setMenuOpen(false));

      updateThemeButton();
      themeToggle.addEventListener("click", () => {
        const isLight = document.documentElement.classList.toggle("light-mode");
        localStorage.setItem("portfolio-theme", isLight ? "light" : "dark");
        updateThemeButton();
      });
    </script>
  </body>
</html>
